plugins { id "com.android.application" }

android {
    namespace "io.github.debloatgtv.glass"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.debloatgtv.glass"
        minSdk 21          // Android TV 5.0+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Sideload-only app: sign with the debug key so CI needs no secrets.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// No runtime dependencies on purpose: framework-only keeps the APK tiny and startup instant.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
